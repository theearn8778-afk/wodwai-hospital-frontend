<!doctype html>
<html lang="th">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>สมัครสมาชิก | วอดวายเวชกรรม</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            font-family: "Segoe UI", Tahoma, sans-serif;
        }
        .auth-wrap {
            width: 100%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-card {
    width: 100%;
    max-width: 1100px;
    min-height: 680px;
    height: 680px;
    display: flex;
}
        .auth-side {
            width: 45%;
        }

        .auth-form {
            width: 55%;
        }
    </style>
</head>

<body class="bg-[#eef9f7] min-h-screen flex items-center justify-center p-5">

    <div class="w-full max-w-5xl bg-white rounded-2xl overflow-hidden shadow-lg flex">

        <!-- =========================
             ฝั่งซ้าย
        ========================== -->
        <section class="w-[45%] bg-[#eaf8f5] flex items-center justify-center p-10">

            <div class="text-center">

                <div class="logo">
                    <img src="logo.png" alt="โลโก้โรงพยาบาล">
                </div>

                <h2 class="text-3xl font-bold text-[#174d5a] leading-tight">
                    ยินดีต้อนรับสู่<br>
                    วอดวายเวชกรรม
                </h2>
            </div>

        </section>


        <!-- =========================
             ฝั่งขวา : แบบฟอร์ม
        ========================== -->
        <section class="w-[55%] p-10">

            <h1 class="text-3xl font-bold text-[#183f52]">
                สมัครสมาชิก
            </h1>

            <p class="text-sm text-gray-500 mt-2 mb-6">
                กรอกข้อมูลเพื่อสร้างบัญชีผู้ใช้สำหรับเว็บไซต์โรงพยาบาล
            </p>


           <form id="registerForm">

    <!-- คำนำหน้า + ชื่อ -->
    <div class="grid grid-cols-2 gap-4">

        <div>
            <label class="block text-xs font-bold text-[#1a3f37] mb-1">
                คำนำหน้า
            </label>

            <select
                id="title"
                class="w-full px-3.5 py-2 text-xs border border-[#cfdfdb]
                       rounded-lg focus:outline-none
                       focus:ring-1 focus:ring-[#3ca085]"
            >
                <option value="นาย">นาย</option>
                <option value="นาง">นาง</option>
                <option value="นางสาว">นางสาว</option>
            </select>
        </div>


        <div>
            <label class="block text-xs font-bold text-[#1a3f37] mb-1">
                ชื่อ-นามสกุล
            </label>

            <input
                id="name"
                type="text"
                required
                placeholder="ชื่อและนามสกุล"
                class="w-full px-3.5 py-2 text-xs border border-[#cfdfdb]
                       rounded-lg focus:outline-none
                       focus:ring-1 focus:ring-[#3ca085]"
            >
        </div>

    </div>


    <!-- วันเกิด + เบอร์ -->
    <div class="grid grid-cols-2 gap-4 mt-4">

        <div>
            <label class="block text-xs font-bold text-[#1a3f37] mb-1">
                วันเกิด
            </label>

            <input
                id="birth_date"
                type="date"
                required
                class="w-full px-3.5 py-2 text-xs border border-[#cfdfdb]
                       rounded-lg focus:outline-none
                       focus:ring-1 focus:ring-[#3ca085]"
            >
        </div>


        <div>
            <label class="block text-xs font-bold text-[#1a3f37] mb-1">
                เบอร์โทรศัพท์
            </label>

            <input
                id="phone"
                type="tel"
                placeholder="08x-xxx-xxxx"
                class="w-full px-3.5 py-2 text-xs border border-[#cfdfdb]
                       rounded-lg focus:outline-none
                       focus:ring-1 focus:ring-[#3ca085]"
            >
        </div>

    </div>


    <!-- Email -->
    <div class="mt-4">

        <label class="block text-xs font-bold text-[#1a3f37] mb-1">
            อีเมล
        </label>

        <input
            id="email"
            type="email"
            required
            placeholder="example@email.com"
            class="w-full px-3.5 py-2 text-xs border border-[#cfdfdb]
                   rounded-lg focus:outline-none
                   focus:ring-1 focus:ring-[#3ca085]"
        >

    </div>


    <!-- Password -->
    <div class="grid grid-cols-2 gap-4 mt-4">

        <div>

            <label class="block text-xs font-bold text-[#1a3f37] mb-1">
                รหัสผ่าน
            </label>

            <div class="relative">

                <input
                    id="password"
                    type="password"
                    required
                    minlength="6"
                    placeholder="กรอกรหัสผ่าน"
                    class="w-full px-3.5 py-2 text-xs border border-[#cfdfdb]
                           rounded-lg focus:outline-none
                           focus:ring-1 focus:ring-[#3ca085]
                           pr-9"
                >

                <button
                    type="button"
                    onclick="togglePassword('password','eye1')"
                    class="absolute right-3 top-1/2 -translate-y-1/2
                           text-gray-500"
                >
                    <i id="eye1" class="fa-regular fa-eye text-xs"></i>
                </button>

            </div>

        </div>


        <!-- Confirm Password -->
        <div>

            <label class="block text-xs font-bold text-[#1a3f37] mb-1">
                ยืนยันรหัสผ่าน
            </label>

            <div class="relative">

                <input
                    id="confirmPassword"
                    type="password"
                    required
                    minlength="6"
                    placeholder="กรอกรหัสผ่านอีกครั้ง"
                    class="w-full px-3.5 py-2 text-xs border border-[#cfdfdb]
                           rounded-lg focus:outline-none
                           focus:ring-1 focus:ring-[#3ca085]
                           pr-9"
                >

                <button
                    type="button"
                    onclick="togglePassword('confirmPassword','eye2')"
                    class="absolute right-3 top-1/2 -translate-y-1/2
                           text-gray-500"
                >
                    <i id="eye2" class="fa-regular fa-eye text-xs"></i>
                </button>

            </div>

        </div>

    </div>


    <!-- สมัคร -->
    <button
        id="registerButton"
        type="submit"
        class="w-full bg-[#3ca085] text-white py-2.5
               rounded-lg mt-6 text-sm font-bold
               hover:bg-[#328c75]"
    >
        <span id="buttonText">สมัครสมาชิก</span>

        <i
            id="loadingIcon"
            class="fa-solid fa-spinner fa-spin hidden ml-2"
        ></i>
    </button>

</form>


            <!-- Divider -->
            <div class="flex items-center gap-3 my-5 text-xs text-gray-400">

                <div class="flex-1 h-px bg-gray-200"></div>

                มีบัญชีอยู่แล้ว?

                <div class="flex-1 h-px bg-gray-200"></div>

            </div>


            <!-- กลับ Login -->
            <a
                href="login.html"
                class="block text-center border border-[#74c8bb]
                       text-[#459d89] py-2.5 rounded-lg text-sm font-bold
                       hover:bg-[#f3fbf9]"
            >
                กลับไปเข้าสู่ระบบ
            </a>

        </section>

    </div>


    <!-- Font Awesome -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/js/all.min.js"></script>


    <script>

    // =========================
    // แสดง / ซ่อน Password
    // =========================
    function togglePassword(inputId, iconId) {

        const input = document.getElementById(inputId);
        const icon = document.getElementById(iconId);

        if (input.type === "password") {

            input.type = "text";

            icon.classList.remove("fa-eye");
            icon.classList.add("fa-eye-slash");

        } else {

            input.type = "password";

            icon.classList.remove("fa-eye-slash");
            icon.classList.add("fa-eye");

        }
    }


    // =========================
    // สมัครสมาชิก
    // =========================
    document
        .getElementById("registerForm")
        .addEventListener("submit", async function (event) {

            event.preventDefault();


            const title =
                document.getElementById("title").value;

            const name =
                document.getElementById("name").value.trim();

            const birth_date =
                document.getElementById("birth_date").value;

            const phone =
                document.getElementById("phone").value.trim();

            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;


            // =========================
            // ตรวจสอบ Password
            // =========================

            if (password.length < 6) {

                alert("รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร");

                return;
            }


            if (password !== confirmPassword) {

                alert("รหัสผ่านและยืนยันรหัสผ่านไม่ตรงกัน");

                return;
            }


            // =========================
            // ปุ่มกำลังโหลด
            // =========================

            const registerButton =
                document.getElementById("registerButton");

            const buttonText =
                document.getElementById("buttonText");

            const loadingIcon =
                document.getElementById("loadingIcon");


            registerButton.disabled = true;

            registerButton.classList.add(
                "opacity-70",
                "cursor-not-allowed"
            );

            buttonText.textContent =
                "กำลังสมัครสมาชิก...";

            loadingIcon.classList.remove("hidden");


            try {

                // =========================
                // ส่งข้อมูลไป Backend
                // =========================

                const response =
                    await fetch("https://wodwai-hospital-backend.onrender.com/api/register", {
                            method: "POST",

                            headers: {
                                "Content-Type": "application/json"
                            },

                            body: JSON.stringify({

                                title: title,

                                name: name,

                                birth_date: birth_date,

                                phone: phone,

                                email: email,

                                password: password,

                                // ผู้สมัครทั่วไป
                                disability_status: false

                            })
                        }
                    );


                const data =
                    await response.json();


                // =========================
                // ถ้า Backend ส่ง Error
                // =========================

                if (!response.ok) {

                    alert(
                        data.message ||
                        "สมัครสมาชิกไม่สำเร็จ"
                    );

                    return;
                }


                // =========================
                // สมัครสำเร็จ
                // =========================

                alert(
                    "สมัครสมาชิกสำเร็จ!\n\n" +
                    "รหัสสมาชิกของคุณคือ\n" +
                    data.user.member_code
                );


                // ไปหน้า Login
                window.location.href = "login.html";


            } catch (error) {

                console.error(
                    "Register Error:",
                    error
                );


                alert(
                    "ไม่สามารถเชื่อมต่อกับ Server ได้\n\n" +
                    "กรุณาตรวจสอบว่า Backend กำลังทำงานอยู่"
                );


            } finally {

                registerButton.disabled = false;

                registerButton.classList.remove(
                    "opacity-70",
                    "cursor-not-allowed"
                );

                buttonText.textContent =
                    "สมัครสมาชิก";

                loadingIcon.classList.add("hidden");

            }

        });

</script>

</body>
</html>
